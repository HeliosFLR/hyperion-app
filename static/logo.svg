<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Black circle background -->
  <circle cx="50" cy="50" r="45" fill="#000000"/>

  <!-- Sun rays (starburst) -->
  <g fill="#ffffff">
    <!-- Center rays radiating outward -->
    <polygon points="50,25 51,45 49,45"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(10 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(20 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(30 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(40 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(50 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(60 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(70 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(80 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(90 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(100 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(110 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(120 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(130 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(140 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(150 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(160 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(170 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-10 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-20 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-30 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-40 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-50 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-60 50 45)"/>
    <polygon points="50,25 53,44 47,44" transform="rotate(-70 50 45)"/>
    <!-- Sun core -->
    <circle cx="50" cy="45" r="12" fill="#ffffff"/>
  </g>

  <!-- Mountain/pyramid -->
  <polygon points="20,85 50,45 80,85" fill="#000000"/>

  <!-- Lightning bolt extending left -->
  <polygon points="12,55 25,55 18,70 28,70 8,95 18,72 10,72" fill="#ffffff"/>
</svg>
